# 前端容器内的 Nginx 配置
# 职责：托管 Vite 构建产物（SPA）+ 把后端相关路径反向代理到 backend 容器
# 注意：upstream 用的是 compose 里的服务名 backend，容器间通过内网 DNS 解析

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 上传图片：必须大于后端限制（后端 spring.servlet.multipart.max-file-size=10MB）
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 带 hash 的前端静态资源，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端接口
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 上传的图片由后端读取本地磁盘后返回
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SEO：站点地图与 robots（后端提供）
    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    location = /robots.txt {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # 前端路由（history 模式）：刷新 /article/xxx 这类地址时回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
