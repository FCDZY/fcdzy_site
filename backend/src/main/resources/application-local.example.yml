# 本地私有配置模板（复制为 application-local.yml 后填写；application-local.yml 不进仓库）
#
# 这个文件放「第三方密钥 + 初始管理员密码」，数据库连接在 application-db.example.yml
# 用法：
#   1) 复制本文件为 application-local.yml
#   2) 填入下面各项
#   3) application.yml 已通过 spring.config.import 自动加载，无需其他操作

spring:
  mail:
    # QQ 邮箱 → 设置 → 账户 → 开启 SMTP → 生成授权码（16 位字母）
    password: 在这里填 SMTP 授权码

site:
  oss:
    # 阿里云 OSS：建议用只有 OSS 权限的 RAM 子账号 AccessKey，不要用主账号
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket-name: 你的 Bucket 名称
    access-key-id: 在这里填 AccessKeyId
    access-key-secret: 在这里填 AccessKeySecret

  jwt:
    # JWT 签名密钥：至少 32 字节的随机串（可用 openssl rand -base64 32 生成）
    # 不填会使用 application.yml 里那个「仅供本地跑通」的默认值，部署前务必替换
    secret: 在这里填 32 字节以上的随机密钥

  admin:
    # 首次启动自动创建管理员时使用的初始密码（账号已存在则不会覆盖）
    password: 在这里填一个强密码