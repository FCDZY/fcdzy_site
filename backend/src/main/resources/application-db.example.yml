# 数据库连接配置模板（可以提交到仓库）
#
# 用法：
#   1) 在本目录复制本文件为 application-db.yml
#   2) 把下面三项换成你自己的数据库信息
#   3) application-db.yml 已在 .gitignore 中，不会被提交
#
# 建议：不要用 root 连接应用，单独建一个只对本站库授权的账号，例如
#   CREATE USER 'fcdzy_app'@'localhost' IDENTIFIED BY '你的强密码';
#   GRANT ALL PRIVILEGES ON fcdzy_site.* TO 'fcdzy_app'@'localhost';
#   FLUSH PRIVILEGES;
#
# 也可以用环境变量覆盖（优先级高于本文件）：DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fcdzy_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: 你的数据库用户名
    password: "你的数据库密码"
